[project]
name = "healthcore-api"
version = "0.1.0"
description = "HealthCore FastAPI API with JWT auth, TinyDB identity, SQLModel inventory, and the supplier directory"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "libpass[bcrypt]>=1.9.3",
    "llama-cpp-python>=0.3.35",
    "markitdown[pdf]>=0.1.8",
    "psycopg2-binary>=2.9.12",
    "py-readability-metrics>=1.4.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "tinydb>=4.9.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
seed = "app.seed_runner:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
