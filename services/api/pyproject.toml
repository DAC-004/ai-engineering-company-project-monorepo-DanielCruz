[project]
name = "healthcore-api"
version = "0.1.0"
description = "HealthCore FastAPI API with JWT auth and TinyDB identity"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "libpass[bcrypt]>=1.9.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = [
    "app.routers.auth",
    "app.core.security",
    "app.core.deps",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
