[project]
name = "healthcore-api"
version = "0.2.0"
description = "HealthCore Digital FastAPI service (incidents + supplier directory)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "tinydb>=4.8.0",
    "pydantic>=2.0.0",
]

[project.scripts]
seed = "app.seed_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
