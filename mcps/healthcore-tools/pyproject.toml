[project]
name = "healthcore-tools"
version = "0.1.0"
description = "HealthCore MCP server for inventory reads, incident tickets, and MCP Auth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
    "mcpauth==0.2.0b1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
healthcore-tools = "healthcore_tools:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
