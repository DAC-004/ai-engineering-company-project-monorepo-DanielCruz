[project]
name = "healthcore-sales-forecast"
version = "0.1.0"
description = "HealthCore monthly revenue forecasting with a regression model"
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "llama-cpp-python>=0.3.35",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["tests"]
