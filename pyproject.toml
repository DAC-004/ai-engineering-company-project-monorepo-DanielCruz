[project]
name = "healthcore-sales-forecasting"
version = "0.1.0"
description = "Leakage-safe HealthCore sales forecasting pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
